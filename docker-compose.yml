# DEV-ONLY compose file (bind mounts, hot reload, default credentials).
# For deployments use the production compose (docker-compose.prod.yml) with
# the hardened Dockerfile.prod images — see PRODUCTION_DEPLOYMENT_GUIDE.md.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-job_tracker}
    ports:
      - "${POSTGRES_PORT:-8139}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8138}:8136"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-job_tracker}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8137}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS: false
      SMTP_SSL: false
    depends_on:
      - db
      - mailpit
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8136 --reload

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-8140}:1025"
      - "${MAILPIT_UI_PORT:-8141}:8025"

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8137}:8137"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8138}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:

